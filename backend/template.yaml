AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SunProof - rooftop solar audit and fix tracking

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
  SenderEmail:
    Type: String
    Default: ""
    Description: SES-verified sender address (set at deploy time, not committed)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE: !Ref Table
        BUCKET: !Ref Bucket
        SENDER_EMAIL: !Ref SenderEmail

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-audio-and-bills
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - S3CrudPolicy: {BucketName: !Ref Bucket}
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: "*"
      Events:
        Verdict:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/homes/{homeId}/verdict"
            Method: GET
        Voice:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/homes/{homeId}/voice"
            Method: POST
        Accuracy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/accuracy"
            Method: GET
    Metadata:
      DockerContext: ..
      Dockerfile: backend/Dockerfile
      DockerTag: python3.12

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref Bucket
